<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#3B82F6"/>
  
  <!-- Neobrutalist shadow offset rectangle -->
  <rect x="8" y="8" width="504" height="504" rx="80" fill="none" stroke="#0F172A" stroke-width="16"/>
  
  <!-- Inner border -->
  <rect x="0" y="0" width="512" height="512" rx="80" fill="none" stroke="#0F172A" stroke-width="16"/>
  
  <!-- "PG" monogram text -->
  <text
    x="256"
    y="340"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="900"
    font-size="280"
    fill="#FFFFFF"
    stroke="#0F172A"
    stroke-width="12"
    paint-order="stroke"
    letter-spacing="-10"
  >PG</text>
</svg>
