<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3" />
      <stop offset="100%" stop-color="#AF52DE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Icon Body with rounded corners and gradient -->
  <rect width="512" height="512" rx="120" fill="url(#icon-grad)" />
  
  <!-- Subtle inner border overlay (glass effect) -->
  <rect x="1" y="1" width="510" height="510" rx="119" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.25" />
  
  <!-- Light reflection/sheen at the top -->
  <path d="M 120 1 A 119 119 0 0 1 392 1 L 392 60 A 60 60 0 0 1 120 60 Z" fill="#FFFFFF" fill-opacity="0.08" />
  
  <!-- "PG" monogram text with a clean, high-end look -->
  <text
    x="256"
    y="335"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="240"
    fill="#FFFFFF"
    filter="url(#glow)"
    letter-spacing="-6"
  >PG</text>
</svg>
