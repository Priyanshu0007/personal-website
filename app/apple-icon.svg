<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="apple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3" />
      <stop offset="100%" stop-color="#AF52DE" />
    </linearGradient>
  </defs>
  
  <!-- Icon Body with rounded corners and gradient -->
  <rect width="180" height="180" rx="42" fill="url(#apple-grad)" />
  
  <!-- Subtle inner border overlay -->
  <rect x="0.5" y="0.5" width="179" height="179" rx="41.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.25" />
  
  <!-- "PG" monogram text -->
  <text
    x="90"
    y="120"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="84"
    fill="#FFFFFF"
    letter-spacing="-2"
  >PG</text>
</svg>
