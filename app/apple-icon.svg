<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#3B82F6"/>
  
  <!-- Neobrutalist border -->
  <rect x="0" y="0" width="180" height="180" rx="36" fill="none" stroke="#0F172A" stroke-width="6"/>
  
  <!-- "PG" monogram -->
  <text
    x="90"
    y="122"
    text-anchor="middle"
